name: "Tauri Build"
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-tauri:
    # ⭐ 修复核心：显式赋予内容写入权限，允许 Action 创建 Release 和 Tag
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        
      - name: install dependencies
        run: npm install
        
      - name: build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 使用 v__VERSION__ 占位符自动匹配 tauri.conf.json 中的版本号
          tagName: v__VERSION__ 
          releaseName: "Safety Inspector Pro v__VERSION__"
          releaseBody: "基于 Vue3 + Tauri 的自动化构建版本 (修复权限逻辑)"
          releaseDraft: true
          prerelease: false
