name: "Tauri Build"
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        
      - name: install dependencies
        run: npm install
        
      - name: build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # 自动获取 tauri.conf.json 中的版本
          releaseName: "Safety Inspector Pro v__VERSION__"
          releaseBody: "基于 Vue3 + Tauri 的终极自动化构建版本"
          releaseDraft: true
          prerelease: false
